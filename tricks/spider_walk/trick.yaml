# spider_walk: fetched with get_trick.py. Edit the description -- it is what Gemini reads
# when deciding whether to play this trick.
description: Lies down like a spider, wiggles its legs, then stays low in the spider stance and can creep around in it. Use for "spider", "walk like a spider" or "crawl". While in it, move, turn and arc walk it slowly in the stance. To leave, call interactive_action spider_up (or any other motion), which wiggles back up to standing.
type: policy
policy: policy.json
start_pose: standing
end_pose: spider
max_body_angle_deg: 60   # the tilt e-stop while the trick plays
actions:
  spider_up: Wiggles its legs and pushes back up to standing, leaving the spider stance.
exit_clip: spider_up
walk:                      # it walks in its stance: move, turn and arc drive this policy
  policy: walk_policy.json
  speed: 0.12              # default m/s for move and arc (above the ~0.1 stand-still band)
  max_forward: 0.15        # m/s; at most 0.15 (what it was trained for)
  max_sideways: 0.1        # m/s; at most 0.1
  turn: 30                 # deg/s; at most 34
  run: false
  note: Creeps slowly, low to the ground, and moves slower than asked. Very slow moves (under about 0.1 m/s) may not step at all.

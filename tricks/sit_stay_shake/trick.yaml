# sit_stay_shake: fetched with get_trick.py. Edit the description -- it is what Gemini reads
# when deciding whether to play this trick.
description: Sits down like a dog with its chest up, and stays sitting until asked for something else. Use this whenever someone says "sit" (sit means sit and stay). While sitting it can shake either front paw, or stand back up.
type: policy
policy: policy.json
start_pose: standing
end_pose: sitting
max_body_angle_deg: 60   # the sit leans back about 35 degrees
actions:
  shake_left: Lifts and shakes its left front paw, then keeps sitting.
  shake_right: Lifts and shakes its right front paw, then keeps sitting.
  stand_up: Stands back up from sitting and leaves the trick, ready to walk.
exit_clip: stand_up
